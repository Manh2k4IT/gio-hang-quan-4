<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập quản trị Gusa</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f1f5f9; font-family: Arial, sans-serif; color: #0f172a; padding: 20px; }
        main { width: 100%; max-width: 420px; padding: 32px; border-radius: 20px; background: white; box-shadow: 0 10px 30px #0f172a15; }
        h1 { margin: 0 0 12px; font-size: 26px; }
        p { line-height: 1.5; }
        label { display: block; margin: 20px 0 8px; font-weight: 700; }
        input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font: inherit; }
        button { width: 100%; margin-top: 24px; padding: 13px; border: 0; border-radius: 8px; background: #008060; color: white; font: inherit; font-weight: 700; cursor: pointer; }
        button:disabled { opacity: .6; cursor: wait; }
        #login-error { color: #dc2626; font-weight: 700; }
        a { color: #008060; }
    </style>
</head>
<body>
    <main>
        <h1>Đăng nhập quản trị</h1>
        <p>Quản lí đơn hàng kho vải quận 4</p>
        <p>Trình duyệt tự nhớ đăng nhập trong 30 ngày. Nếu dùng máy chung, hãy đăng xuất sau khi sử dụng.</p>
        <form id="admin-login-form">
            <label for="email">Tài khoản</label>
            <input id="email" type="email" autocomplete="username" required>
            <label for="password">Mật khẩu</label>
            <input id="password" type="password" autocomplete="current-password" required maxlength="256">
            <p id="login-error" role="alert" hidden></p>
            <button id="login-submit" type="submit">Đăng nhập</button>
        </form>
        <p><a href="/shop.html">Về cửa hàng</a></p>
    </main>
    <script src="/js/admin-login.js"></script>
</body>
</html>
